    <script>
      (function() {
        // Prevent unhandled exception if an external/injected script attempts to assign to a getter-only fetch
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && String(event.reason).indexOf('fetch') !== -1 && String(event.reason).indexOf('getter') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Define a setter for window.fetch if only a getter exists
        try {
          var targets = [window, Window.prototype];
          for (var i = 0; i < targets.length; i++) {
            var target = targets[i];
            var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
            if (desc && !desc.set) {
              var currentFetch = window.fetch ? window.fetch.bind(window) : null;
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (e) {
          // Ignore if descriptor is non-configurable
        }
      })();
    </script>
